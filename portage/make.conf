# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.

# Compile flags
CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"
COMMON_FLAGS="-O3 -pipe -march=native -flto=7 ${WARNING_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

## THREADS = mininproc, free --giga), eg: -j16 -l16 for 8 cores and 16 threads with 64 gb ram
MAKEOPTS="-j32 -l32"

# VIDOE DRIVER
# When buy an portable monitor for amdgpu usb c then have VIDEO_CARDS ="amdgpu" and recompile the kernel to not use nvidia, And then build VM with GPU passthrough for nvidia
VIDEO_CARDS="nouveau nvk"

# NOTE: This stage was built with the bindist Use flag enabled
# GLOBAL USE FLAGS
USE="-*"

USE="$USE acl alsa bash-completion crypt curl dbus dri egl hardened \
idn jit lto multilib ncurses nls networkmanager pam readline selinux \
session ssl symlink threads tools udev unicode usb utils verify-sig \
vulkan wayland xattr zlib zstd"

# Licenses 
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8
# Optional: fine-tune localization preferences

# Rust flag
RUSTFLAGS="-C target-cpu=native -C opt-level=3"

PYTHON_SINGLE_TARGET="python3_14"
PYTHON_TARGETS="python3_14"
LUA_SINGLE_TARGET="lua5-4"
LUA_TARGETS="lua5-4"

CURL_SSL="openssl"

LLVM_SLOT="22"
ABI_X86="32 64"

# Changes after
SELINUX_POLICY_TYPES="targeted mcs"

# Mirrors SWE AND GER
GENTOO_MIRRORS="https://ftp.lysator.liu.se/gentoo/ \
  rsync://ftp.lysator.liu.se/gentoo/ \
  ftp://ftp.lysator.liu.se/gentoo/ \
  https://mirrors.dotsrc.org/gentoo/ \
  ftp://mirrors.dotsrc.org/gentoo/ \
  rsync://mirrors.dotsrc.org/gentoo/ \
  https://ftp.fau.de/gentoo \
  ftp://ftp.fau.de/gentoo \
